<script src="diagnostics.js?v=37"></script>
<script>
(function(){
  function showFailure(kind,detail){
    try{
      if(window.__RAWGAME_EXECUTION_FINISHED)return;
      var msg=document.getElementById("msg"),state=document.getElementById("state");
      if(msg){msg.textContent=kind+(detail?" · "+String(detail):"");msg.setAttribute("role","alert")}
      if(state){state.textContent="تعذر إكمال التنفيذ";state.className="state-value bad"}
      var retry=document.getElementById("retry");if(retry)retry.hidden=false;
      document.body.className="fail";
    }catch(e){}
  }
  window.addEventListener("error",function(e){showFailure("خطأ في الصفحة",e&&(e.message||e.error)||"")},false);
  window.addEventListener("unhandledrejection",function(e){var r=e&&e.reason;showFailure("خطأ أثناء التنفيذ",r&&r.message||r||"")},false);
})();
</script>
<header id="brand"><div class="brand-main"><div class="mark">PS4</div><div class="brand-copy"><b>تنفيذ التفعيل</b><small>مرحلة التنفيذ المحلية</small></div></div><div class="phase"><i></i><span>الحالة</span><b id="phaseText">قيد البدء</b></div></header>
<main id="wrap"><section class="panel"><div class="panel-head"><strong>متابعة حالة الجلبريك</strong><p>اترك الصفحة مفتوحة حتى تظهر النتيجة النهائية.</p></div><div class="statebox"><div class="state-label">المرحلة الحالية</div><div id="state" class="state-value">جارٍ تجهيز التنفيذ…</div><div class="state-line"><span></span></div></div><div class="mini"><span class="chip ok">تشغيل محلي</span><span class="chip">فحص المراحل</span><span class="chip">استعادة محدودة</span></div><div id="msg" class="result" aria-live="polite"></div><button id="retry" type="button" hidden>إعادة تحميل صفحة التنفيذ</button><a id="returnLauncher" class="return-link" href="index.html" hidden>الرجوع إلى المشغّل</a><div id="out" aria-label="سجل التشخيص"></div></section></main>
<script type="module">import "./jb.js?v=37";</script>
<script>
(function(){
  "use strict";
  window.__RAWGAME_MODULE_WATCHDOG_FIRED=false;
  window.__RAWGAME_WATCHDOG_PHASE="boot";
  var retry=document.getElementById("retry"),state=document.getElementById("state"),msg=document.getElementById("msg"),phase=document.getElementById("phaseText");
  if(retry)retry.addEventListener("click",function(){if(!window.__RAWGAME_EXECUTION_FINISHED)location.reload()},false);
  var bootWarn=setTimeout(function(){
    if(window.__RAWGAME_MODULE_BOOTED||window.__RAWGAME_EXECUTION_FINISHED)return;
    window.__RAWGAME_MODULE_WATCHDOG_FIRED=true;window.__RAWGAME_WATCHDOG_PHASE="module-warn";
    if(msg){msg.textContent="ما زال تحميل وحدة التنفيذ جاريًا";msg.setAttribute("role","status");msg.style.display="block"}
    if(state){state.textContent="تحميل وحدة التنفيذ يستغرق وقتًا أطول";state.className="state-value warn"}
    if(phase)phase.textContent="تحميل متأخر";
  },15000);
  var bootFail=setTimeout(function(){
    if(window.__RAWGAME_MODULE_BOOTED||window.__RAWGAME_EXECUTION_FINISHED)return;
    window.__RAWGAME_WATCHDOG_PHASE="module-timeout";
    if(msg){msg.textContent="لم تبدأ وحدة التنفيذ؛ يمكنك إعادة تحميل الصفحة";msg.setAttribute("role","alert")}
    if(state){state.textContent="تعذر بدء وحدة التنفيذ";state.className="state-value bad"}
    if(retry)retry.hidden=false;
    var returnLauncher=document.getElementById("returnLauncher");if(returnLauncher)returnLauncher.hidden=false;
    if(phase)phase.textContent="تعذر البدء";
    document.body.className="fail";
  },30000);
  window.__RAWGAME_MODULE_WATCHDOG=bootFail;
  window.__RAWGAME_CLEAR_WATCHDOG=function(){try{clearTimeout(bootWarn);clearTimeout(bootFail)}catch(e){}};
  var softGuard=setInterval(function(){
    try{
      if(window.__RAWGAME_EXECUTION_FINISHED){clearInterval(softGuard);return}
      if(window.__RAWGAME_MODULE_BOOTED&&typeof window.__RAWGAME_LAST_PROGRESS==="number"){
        var stale=Date.now()-window.__RAWGAME_LAST_PROGRESS;
        if(stale>60000&&stale<=180000&&document.body.className!=="done"&&document.body.className!=="fail"){
          window.__RAWGAME_WATCHDOG_PHASE="progress-stale-warning";
          if(msg){msg.textContent="التنفيذ ما زال جاريًا؛ بانتظار المرحلة التالية";msg.setAttribute("role","status");msg.style.display="block"}
          if(state){state.textContent="بانتظار نقطة التحقق التالية";state.className="state-value warn"}
          if(phase)phase.textContent="قيد الانتظار";
        }else if(stale<=60000){if(msg&&msg.getAttribute("role")==="status")msg.style.display="none"}
      }
    }catch(e){}
  },5000);
  window.addEventListener("error",function(e){
    if(window.__RAWGAME_EXECUTION_FINISHED)return;
    if(e&&e.target&&e.target.tagName==="SCRIPT"){
      if(msg){msg.textContent="فشل تحميل وحدة التنفيذ؛ أعد المحاولة";msg.setAttribute("role","alert")}
      if(state){state.textContent="فشل تحميل وحدة التنفيذ";state.className="state-value bad"}
      if(retry)retry.hidden=false;
      var returnLauncher=document.getElementById("returnLauncher");if(returnLauncher)returnLauncher.hidden=false;
      if(phase)phase.textContent="خطأ";
      document.body.className="fail";
    }
  },true);
})();
</script>
